name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    name: Security · Ruby
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities (Brakeman)
        run: bin/brakeman --no-pager

      - name: Scan for known vulnerabilities in gems (bundler-audit)
        run: bin/bundler-audit --update

  lint:
    name: Lint · RuboCop
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: Test · RSpec + Coverage
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      # Lets the app boot in CI without a real master key.
      SECRET_KEY_BASE_DUMMY: "1"
      # Turns on SimpleCov (GitHub also sets CI=true automatically).
      COVERAGE: "true"
    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database (SQLite)
        run: bin/rails db:test:prepare

      - name: Run RSpec test suite
        run: bundle exec rspec

      - name: Append coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            line=$(ruby -rjson -e 'r=JSON.parse(File.read("coverage/.last_run.json"))["result"]; puts r["line"]')
            branch=$(ruby -rjson -e 'r=JSON.parse(File.read("coverage/.last_run.json"))["result"]; puts(r["branch"] || "n/a")')
            {
              echo "### 🧪 Test coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              echo "| Line | ${line}% |"
              echo "| Branch | ${branch}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
